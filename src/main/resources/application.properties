# ==========================================
# CONFIGURAÇÃO DA BASE DE DADOS
# ==========================================

# URL de conexão com o seu banco de dados (Ex: jdbc:mysql://localhost:3306/estoque_db)
spring.datasource.url=jdbc:mysql://172.16.0.30:3306/cvdo_estoque?createDatabaseIfNotExist=true&serverTimezone=UTC

# Nome de usuário para acessar o banco de dados (Ex: root, admin)
spring.datasource.username=cvdo

# Senha para acessar o banco de dados
spring.datasource.password=gmSenai

# Classe do driver JDBC de acordo com o banco que você usar (Ex: com.mysql.cj.jdbc.Driver para MySQL)
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# (Propriedade comentada) Define o dialeto que o Hibernate vai usar. 
# Isso otimiza o código SQL gerado especificamente para o MySQL 8.
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


# ==========================================
# CONFIGURAÇÃO DO HIBERNATE E INICIALIZAÇÃO
# ==========================================

# Habilita criação de tabelas e leitura do arquivo import.sql
# 
# TRADUÇÃO DO TEXTO ORIGINAL EM INGLÊS:
# O arquivo 'import.sql' é um recurso do Hibernate e só será executado se 
# a propriedade 'spring.jpa.hibernate.ddl-auto' (ou a propriedade subjacente 
# do Hibernate 'hibernate.hbm2ddl.auto') estiver definida como 'create' ou 'create-drop'. 
# Se estiver definida como 'update', 'validate' ou 'none', o 'import.sql' não será executado.

# (Propriedade comentada - repetida abaixo)
#spring.jpa.hibernate.ddl-auto=create

# Define a estratégia de geração do banco de dados.
# A opção 'create' deleta todas as tabelas e cria do zero sempre que você roda o projeto. 
# CUIDADO: Nunca use 'create' ou 'create-drop' em produção (produção pede 'update' ou 'validate').
spring.jpa.hibernate.ddl-auto=none

# (Propriedade comentada) Determina se o Spring deve sempre inicializar o banco rodando 
# scripts SQL (como data.sql ou schema.sql). Nota: o correto seria "always" (com L).
#spring.sql.init.mode=always

# (Propriedade comentada) Aponta o caminho onde o Spring deve procurar o arquivo 
# de script SQL para inserir dados logo após criar as tabelas.
#spring.sql.init.data-locations=classpath:import.sql


# ==========================================
# INFORMAÇÕES DA APLICAÇÃO
# ==========================================

# Define o nome do seu projeto. É muito útil para identificação em logs, 
# monitoramento e arquitetura de microsserviços.
spring.application.name=EstoqueApiAplication